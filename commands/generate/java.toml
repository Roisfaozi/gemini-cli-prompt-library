prompt = """
# Generate Code in Java

Please generate a Java program that solves the following problem:

{{args}}

## Requirements:
- The code should follow Java best practices and be well-structured.
- Include comments to explain the logic.
- Provide a `main` method with a clear example of how to use the code.
- Ensure the code is runnable and produces the correct output.
- Use a standard project structure (e.g., Maven or Gradle).

## Example:

User request: "a simple program to read a file"

```java
import java.io.File;
import java.io.FileNotFoundException;
import java.util.Scanner;

public class FileReader {
    public static void main(String[] args) {
        try {
            File myObj = new File("filename.txt");
            Scanner myReader = new Scanner(myObj);
            while (myReader.hasNextLine()) {
                String data = myReader.nextLine();
                System.out.println(data);
            }
            myReader.close();
        } catch (FileNotFoundException e) {
            System.out.println("An error occurred.");
            e.printStackTrace();
        }
    }
}
```
"""
