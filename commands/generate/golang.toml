prompt = """
# Generate Code in Go

Please generate a Go program that solves the following problem:

{{args}}

## Requirements:
- The code should be well-structured and idiomatic Go.
- Include comments to explain the logic.
- Provide a `main` function with a clear example of how to use the code.
- Ensure the code is runnable and produces the correct output.

## Example:

User request: "a simple web server"

```go
package main

import (
    "fmt"
    "log"
    "net/http"
)

func handler(w http.ResponseWriter, r *http.Request) {
    fmt.Fprintf(w, "Hello, World!")
}

func main() {
    http.HandleFunc("/", handler)
    log.Println("Starting server on :8080")
    if err := http.ListenAndServe(":8080", nil); err != nil {
        log.Fatal(err)
    }
}
```
"""
